name: CD - Despliegue Continuo (Preparación)

on:
  push:
    branches:
      - main

jobs:
  deploy-check:
    name: Despliegue Producción
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalación de dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar Prisma Client
        run: pnpm db:generate

      - name: Verificación Build de Producción
        run: pnpm build

      - name: Notificar listo para despliegue
        run: echo "Compilación de producción exitosa. Listo para conectar Vercel tokens."
