services:
  # ── PostgreSQL Database ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jeo
      POSTGRES_PASSWORD: jeo_pass
      POSTGRES_DB: jeo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeo -d jeo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS API ──
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://jeo:jeo_pass@db:5432/jeo_db
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/stats || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    # Dev: uncomment for hot-reload
    # volumes:
    #   - ./apps/api/src:/app/apps/api/src
    #   - ./packages/shared/src:/app/packages/shared/src

  # ── Next.js Frontend ──
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    # Dev: uncomment for hot-reload
    # volumes:
    #   - ./apps/web/src:/app/apps/web/src
    #   - ./packages/shared/src:/app/packages/shared/src

volumes:
  pgdata:
